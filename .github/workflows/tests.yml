name: Engine tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python -m civsim verify examples/seed-42
      - run: python -m civsim verify examples/phase2-seeds-0-19/seed13-reallocated
      - run: python -m civsim verify examples/phase3/seed7-capital
      - run: python -m civsim verify examples/phase5/seed7-integrated
      - run: python -m civsim verify examples/phase5b/seed0-feedback
      - run: python -m civsim verify examples/phase5c/seed0-elections
      - run: python -m civsim verify examples/phase5d/seed0-actions
      - run: python -m civsim verify examples/phase6a/seed0-diplomacy
      - run: python -m civsim verify samples/phase6a1/seed0-capped

